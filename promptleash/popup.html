<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 训狗器 (PromptLeash) · 设置</title><link rel="stylesheet" href="popup.css"><body><main><header><img src="icons/48.png" width="40" height="40" alt=""><div><h1>AI 训狗器 (PromptLeash)</h1><p>少点废话，多点正事。</p></div></header><span class="tag">本地运行 · 不上传对话</span><section><h2>回答，直奔重点</h2><label>防废话模式<input id="concise" type="checkbox" role="switch"></label><p>发送前追加回答要求，不替你改变问题。</p><label for="limit">字数上限<input id="limit" type="number" min="50" max="5000" step="50" value="300"></label></section><section><h2>按你的节奏来</h2><label>纠偏只填入不发送<input id="fillOnly" type="checkbox" role="switch"></label><label>显示悬浮面板<input id="showPanel" type="checkbox" role="switch" checked></label></section><p id="status" role="status">设置自动保存在此设备</p><footer>支持 ChatGPT / Claude<br>独立工具，与上述平台无隶属关系</footer></main><script src="popup.js"></script></body></html>
